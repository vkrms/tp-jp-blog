# Writer: one new article per run (max 2 per week, content/policy.yaml). Manual runs only; the weekly schedule is schedule.yml.
name: "agent: write"
on:
  workflow_dispatch:
    inputs:
      dry_run: {type: boolean, default: false, description: "Open the PR but never merge"}
jobs:
  write:
    uses: ./.github/workflows/agent.yml
    permissions: {contents: write, pull-requests: write, actions: write}
    with:
      task: writer
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
