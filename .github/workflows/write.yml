# ШАБЛОН (не проверялся). Раз в неделю агент-автор пишет одну новую статью из очереди и открывает PR.
# Запуск агента: Claude Code в headless-режиме (`claude -p`) с промптом из agents/writer.md.
# Авторизация: токен подписки Claude Team (секрет CLAUDE_CODE_OAUTH_TOKEN, выдаётся командой `claude setup-token`). Нужно разрешение Actions создавать PR.
# Если IT/админ Team не разрешат токен подписки — заменить на ANTHROPIC_API_KEY (организация в Claude Console).
# Агент не имеет прав деплоя: только ветка + PR. Влив PR — по policy.yaml (auto-merge при зелёном validate) или вручную.
name: write-article
on:
  schedule: [{cron: "0 21 * * 2"}]   # воскресенье 21:00 UTC = понедельник утро в Японии
  workflow_dispatch: {}
jobs:
  update:
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude -p "$(cat agents/writer.md)" --permission-mode acceptEdits --allowedTools "Read,Write,Edit,WebFetch,WebSearch,Bash(node tools/validate.mjs)"
        env: {CLAUDE_CODE_OAUTH_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}"}
      - run: node tools/validate.mjs
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/write-${{ github.run_id }}
          title: "Новая статья из очереди"
          body-path: .bot-report.md   # агент пишет отчёт сюда: что изменилось, откуда, что не удалось проверить
