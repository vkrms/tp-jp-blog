# Weekly agent schedule: every week has independently 1-2 writer slots and 1-2 updater slots, on random weekdays,
# chosen by tools/agent-plan.mjs (deterministic per ISO week, Japan time). If both land on the same day they run as
# two separate agent.yml calls; its "agent-content" concurrency group queues them instead of racing on content/.
# Runs Mon–Fri 09:00 JST and starts only the agent(s) today actually has a slot for. Preview: npm run agent:plan
# (also: a dev-only schedule view at /dev/schedule/ while `npm run dev` is running).
name: "agent: schedule"
on:
  schedule: [{cron: "0 0 * * 1-5"}]
  workflow_dispatch: {}
permissions: {}
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }} # JSON array: [] | ["writer"] | ["updater"] | ["writer","updater"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - id: plan
        env:
          AGENT_PLAN_SALT: ${{ vars.AGENT_PLAN_SALT }}
        run: node tools/agent-plan.mjs --today
  run-writer:
    needs: plan
    # agents run only once switched on (repo variable AGENTS_ENABLED=true)
    if: contains(fromJson(needs.plan.outputs.tasks), 'writer') && vars.AGENTS_ENABLED == 'true'
    uses: ./.github/workflows/agent.yml
    permissions: {contents: write, pull-requests: write, actions: write}
    with: {task: writer}
    secrets: inherit
  run-updater:
    needs: plan
    if: contains(fromJson(needs.plan.outputs.tasks), 'updater') && vars.AGENTS_ENABLED == 'true'
    uses: ./.github/workflows/agent.yml
    permissions: {contents: write, pull-requests: write, actions: write}
    with: {task: updater}
    secrets: inherit
