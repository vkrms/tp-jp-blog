# Updater: facts due for refresh, source links, expired sales. Manual runs only; the weekly schedule is schedule.yml.
name: "agent: update"
on:
  workflow_dispatch:
    inputs:
      dry_run: {type: boolean, default: false, description: "Open the PR but never merge"}
jobs:
  update:
    uses: ./.github/workflows/agent.yml
    permissions: {contents: write, pull-requests: write, actions: write}
    with:
      task: updater
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
