# Checks for human PRs. Agent PRs are checked by the gate inside agent.yml (PRs opened with GITHUB_TOKEN
# do not trigger this workflow).
name: validate
on: [pull_request]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - run: node tools/terms.mjs   # «updater», not обновлятор/апдейтер (see AGENTS.md)
      - run: node tools/validate.mjs
      - run: node --test tools/*.test.mjs
